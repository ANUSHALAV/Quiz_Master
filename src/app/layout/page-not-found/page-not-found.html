<div class="min-h-screen flex justify-center items-center bg-[var(--background-color)] px-4">

    <div class="bg-white shadow-xl rounded-2xl w-full max-w-2xl p-10 border border-[var(--border-color)] text-center">
        <h1 class="text-6xl font-extrabold mb-2 tracking-wide">404</h1>
        <h2 class="font-bold mb-3">Page Not Found</h2>
        <p class="text-[var(--text-secondary-color)] mb-8">Oops! The page you are looking for doesn’t exist or has been
            moved.</p>

        <hr class="mb-8 border-[var(--border-color)]" />

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">

            <div class="bg-slate-50 rounded-xl p-4 border border-[var(--border-color)]">
                <i class="fa-solid fa-house text-red-600 text-xl mb-2"></i>
                <h4 class="font-semibold">Go Home</h4>
                <p class="text-sm">Return to the main page</p>
            </div>

            <div class="bg-slate-50 rounded-xl p-4 border border-[var(--border-color)]">
                <i class="fa-solid fa-arrow-left text-red-600 text-xl mb-2"></i>
                <h4 class="font-semibold">Go Back</h4>
                <p class="text-sm text-[var(--text-secondary-color)]">Navigate to previous page</p>
            </div>

            <div class="bg-slate-50 rounded-xl p-4 border border-[var(--border-color)]">
                <i class="fa-solid fa-circle-question text-red-600 text-xl mb-2"></i>
                <h4 class="font-semibold">Need Help?</h4>
                <p class="text-sm text-[var(--text-secondary-color)]">Contact support if needed</p>
            </div>
        </div>

        <div class="flex justify-center gap-4">
            <button
                class="px-6 py-3 rounded-xl font-medium bg-red-600 hover:bg-red-700 text-white flex items-center gap-2 transition"
                (click)="onGoToHome()"><i class="fa-solid fa-house"></i>Home
            </button>

            <button class="px-6 py-3 rounded-xl font-medium
                       bg-slate-100 hover:bg-slate-200
                       flex items-center gap-2 transition" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>Go Back
            </button>
        </div>
    </div>
</div>
